entity_types:
  concessionaria:
    fato: fato_os
    coluna: concessionaria_id
    valor: valor_total
    quebras_validas: [departamento, vendedor, empresa]
  departamento:
    fato: fato_os
    coluna: departamento_id
    valor: valor_total
    quebras_validas: [concessionaria, vendedor, empresa]
  vendedor:
    fato: fato_os
    coluna: vendedor_id
    valor: valor_total
    quebras_validas: [concessionaria, departamento, empresa]
  # produtivo é por item de serviço (os_servicos), não único por OS — vive em fato_os_servico
  produtivo:
    fato: fato_os_servico
    coluna: produtivo_id
    valor: valor_atribuido
    quebras_validas: [concessionaria, departamento, servico, familia_servico, vendedor, empresa]
  empresa:
    fato: fato_os
    coluna: empresa_id
    valor: valor_total
    quebras_validas: [concessionaria, departamento, vendedor]
  familia_servico:
    fato: fato_os_servico
    coluna: familia_servico_id
    valor: valor_atribuido
    quebras_validas: [concessionaria, departamento, servico, produtivo]
  servico:
    fato: fato_os_servico
    coluna: servico_id
    valor: valor_atribuido
    quebras_validas: [concessionaria, departamento, familia_servico, produtivo]
  forma_pagamento:
    fato: fato_os_pagamento
    coluna: forma_pagamento_id
    valor: valor_pago
    quebras_validas: [concessionaria, departamento]

  # comissionado_id é FK polimórfica (discriminada por comissao_tipo_id):
  # 1=CONCESSIONÁRIA → dim_concessionaria
  # 2=VENDEDOR → dim_funcionario
  # 3=PRODUTIVO → dim_funcionario
  # 4=INDICADOR1, 5=INDICADOR2 → dim_indicador (MySQL indicadores)
  comissao_vendedor:
    fato: fato_comissao
    coluna: comissionado_id
    valor: valor_comissao
    filtro_fixo:
      comissao_tipo_id: ["2"]
    resolve_dim: dim_funcionario
    quebras_validas: []
  comissao_produtivo:
    fato: fato_comissao
    coluna: comissionado_id
    valor: valor_comissao
    filtro_fixo:
      comissao_tipo_id: ["3"]
    resolve_dim: dim_funcionario
    quebras_validas: []
  comissao_concessionaria:
    fato: fato_comissao
    coluna: comissionado_id
    valor: valor_comissao
    filtro_fixo:
      comissao_tipo_id: ["1"]
    resolve_dim: dim_concessionaria
    quebras_validas: []
  comissao_indicador:
    fato: fato_comissao
    coluna: comissionado_id
    valor: valor_comissao
    filtro_fixo:
      comissao_tipo_id: ["4", "5"]
    resolve_dim: dim_indicador
    quebras_validas: []
  # Total por categoria de comissão (sem filtrar o "quem")
  comissao_tipo:
    fato: fato_comissao
    coluna: comissao_tipo_id
    valor: valor_comissao
    quebras_validas: []

granularidades_validas: [diario, semanal, mensal, semestral, anual]
comparacoes_validas: [vs_periodo_anterior, vs_mesmo_periodo_ano_anterior]
